<!DOCTYPE html>
<head>
    <title>HTML Layout</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        nav{
            background-color: #2f4f6f;   
            color: white;
            height: 10vh;
            width: 100%;
            display: flex;
            align-items: center;
        }
        nav ul {
            list-style: none;       
            display: flex;          
            margin: 0;              
            padding: 0;          
        }
        nav ul li{
            font-size: 20px;
            margin-left: 30px;
            padding: 20px;
        }
        nav ul li:hover{
            cursor: pointer;
            background-color: aliceblue;
            color: black;
        }
        main {
            display: flex;
            gap: 10px;
        }
        div{
            margin-top: 5px;
            margin-bottom: 5px;
        }
        #left_panel{
            background-color: #e8edf3;   
            height: 80vh;
            width: 32%;
            border: 2px solid black;    
        }
        #mid_panel{
            background-color: #d6e0ea;   
            height: 80vh;
            width: 32%;
            border: 2px solid black;
        }
        p{
            font-size: 25px;
            color: black;   
        }
        #right_panel{
            background-color: #c7d4df;  
            height: 80vh;
            width: 32%;
            border: 2px solid black;
        }
        footer{
            background-color: grey;
            height: 8vh;
            width: 100%;
            color: lightcyan;
            text-align: center;
            font-size: 20px;
        }
    </style>
</head>

<body>
    
<header>
    <nav>
        <ul>
            <li>Home</li>
            <li>About Us</li>
            <li>Contact</li>
        </ul>
    </nav>
</header>

<main>
    <div id="left_panel">
       
    </div>

    <div id="mid_panel">
       
    </div>

    <div id="right_panel">
       
    </div>
</main>

<footer>
    Copyright &copy; Saloni jayswal
</footer>

</body>
</html>
