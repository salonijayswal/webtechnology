<!DOCTYPE html>
<html>
<head>
    <title>HTML Table</title>
    <style>
        *{
            margin: 0;
            padding: 0;
        }
        body{
            background-color: whitesmoke;
            color: #4c2c3c;     
        }
        h2{
            color: black;
            text-align: center;
        }
        table{
            height: 80vh;
            width: 80vw;
            margin: auto;
        }
        table,th,td{
            border: 1px solid black;
            border-collapse: collapse;
        }
    </style>
</head>
<body>

    <h2>Student Information</h2>

    <table>

            <th rowspan="2">S.N.</th>
            <th colspan="2">Student Name</th>

        </tr>
